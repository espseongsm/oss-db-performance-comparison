[project]
name = "db-performance-comparison"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "psutil>=6,<8",
    "pyarrow>=19,<24",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
snowflake = [
    "keyring>=25,<26",
    "snowflake-connector-python[pandas]>=3.12,<5",
]
vector = [
    "clickhouse-connect>=1.8.0",
    "psycopg[binary]>=3.3.6",
    "pymilvus>=3.0.2",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.15,<1.16",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sqlite-vec>=0.1.9",
    "weaviate-client>=4.23.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

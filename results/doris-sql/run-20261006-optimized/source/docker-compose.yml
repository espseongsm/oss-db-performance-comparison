name: db-performance-comparison

services:
  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    volumes:
      - .:/bench:ro
      - ./results:/results
    environment:
      DORIS_HOST: doris
      DORIS_SQL_PORT: "9030"
      DORIS_HTTP_PORT: "8040"
    networks:
      - benchmark

  duckdb:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    volumes:
      - .:/bench:ro
      - ./results:/results
      - duckdb_data:/data/duckdb
    networks:
      - benchmark

  sqlite:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    volumes:
      - .:/bench:ro
      - ./results:/results
      - sqlite_data:/data/sqlite
    networks:
      - benchmark

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - benchmark

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/benchmark-user.xml:/etc/clickhouse-server/users.d/benchmark-user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user benchmark --password benchmark --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - benchmark

  doris:
    image: apache/doris:all-in-one-4.1.3
    cpus: ${DORIS_CPUS:-4}
    mem_limit: ${DORIS_MEMORY:-8g}
    environment:
      FE_HEAP: "1024m"
      BE_HEAP: "512m"
      BE_CONFIG_EXTRA: "mem_limit = 75%"
    ports:
      - "127.0.0.1:19030:9030"
      - "127.0.0.1:18040:8040"
    volumes:
      - doris_data:/opt/apache-doris/be/storage
      - doris_meta:/opt/apache-doris/fe/doris-meta
      - doris_be_logs:/opt/apache-doris/be/log
      - doris_fe_logs:/opt/apache-doris/fe/log
    networks:
      - benchmark

networks:
  benchmark:

volumes:
  duckdb_data:
  sqlite_data:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  doris_data:
  doris_meta:
  doris_be_logs:
  doris_fe_logs:
